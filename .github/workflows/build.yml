name: Build Size Pro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Removemos o setup-gradle e os caches para evitar os erros do GitHub
    - name: Generate Gradle Wrapper
  run: gradle wrapper --gradle-version 8.7 --no-validate-url

    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SizePro-APK
        path: app/build/outputs/apk/debug/app-debug.apk
